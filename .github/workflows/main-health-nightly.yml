name: main-health-nightly
# صحة main ليلًا: المجموعة الكاملة على main؛ عند الفشل يفتح/يحدّث issue واحدة بقائمة الأعطال.
# pre-push المحلي يشغّل المتأثر فقط؛ هذا الفحص يكشف تعفّن الاختبارات التي لا يلمسها أحد.
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: ./.github/actions/setup-workspace
      - name: Build
        run: pnpm --filter @workspace/majalis run build
      - name: Full test suite
        id: tests
        continue-on-error: true
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log"; exit "${PIPESTATUS[0]}"
      - name: Open or update failure list
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "فشل فحص صحة main الليلي — $(git rev-parse --short HEAD)"
            echo
            echo '```'
            grep -E "^(✗|not ok|.*FAIL)" "$RUNNER_TEMP/test.log" | sort -u | head -60
            echo '```'
            echo
            echo "السجل: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"
          n=$(gh issue list --label main-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
          else gh issue create --title "main-health: أعطال الفحص الليلي" --label main-health --body-file "$RUNNER_TEMP/body.md"; fi
      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
