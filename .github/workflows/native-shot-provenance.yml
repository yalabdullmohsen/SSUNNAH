name: native shot provenance
# يفشل إن أضاف PR لقطات تحت docs/native/ بلا PROVENANCE.txt من native-shot-guard.sh (لقطات من بناء قديم/مجهول). ubuntu رخيص.
on:
  pull_request:
    branches: [native-app]
    paths: ['docs/native/**']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - run: bash scripts/native-shot-provenance-guard.sh
        env:
          BASE_REF: origin/${{ github.base_ref }}
