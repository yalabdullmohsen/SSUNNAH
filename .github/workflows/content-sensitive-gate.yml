name: content-sensitive gate
# قاعدة يوسف: PR يمسّ نصًا شرعيًا لا يُدمج إلا بوسم visually-verified بعد فحص لقطة بصرية.
# لا فشل أحمر: الوظيفة تنجح دائمًا وتنشر commit status باسم «content-sensitive» (pending ← success عند الوسم أو عند لقطة مسمّاة لكل ملف حسّاس).
# القرار في scripts/content-sensitive-gate.sh (مختبَر بـscripts/test-content-sensitive-gate.sh)؛ الوسم يسقط عند synchronize فقط إن مسّت الدفعة ملفًا حسّاسًا.
# المسارات الحسّاسة في .github/content-sensitive-paths (مختبَرة بـscripts/test-content-sensitive-paths.sh).
on:
  pull_request:
    branches: [native-app]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: content-sensitive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: حالة الحساسية
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name]|join(",")')
          export LABELS ACTION BASE_REF SHA BEFORE
          OUT=$(bash scripts/content-sensitive-gate.sh)
          echo "$OUT"
          eval "$(echo "$OUT" | grep -E '^(STATE|DROP_LABEL)=')"
          DESC=$(echo "$OUT" | sed -n 's/^DESC=//p' | cut -c1-135)
          [ "$DROP_LABEL" = yes ] && { gh pr edit "$PR" --remove-label visually-verified || true; }
          gh api "repos/$REPO/statuses/$SHA" -f state=$STATE -f context=content-sensitive -f description="$DESC"
