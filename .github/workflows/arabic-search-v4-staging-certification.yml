name: Arabic Search v4 Staging Certification

# STAGING ONLY. No Production SQL. No Production flag enable.
on:
  workflow_dispatch:
    inputs:
      stop_after:
        description: "Stop after phase (baseline = no DB writes/migration)"
        required: true
        type: choice
        options:
          - full
          - baseline
        default: full

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: arabic-search-v4-staging-cert
  cancel-in-progress: false

jobs:
  certify:
    name: staging-certify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      EXPECTED_STAGING_REF: dgxzcmzcapzcrvcfzjmc
      PRODUCTION_SUPABASE_PROJECT_REF: ngmvmlulzacrlicuagyp
      CERT_STOP_AFTER: ${{ inputs.stop_after == 'baseline' && 'baseline' || '' }}
      PG_MODULE_PATH: /tmp/staging-cert-node/node_modules/pg
    steps:
      - name: Preflight identity (no secret values)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os,sys
          from urllib.parse import urlparse
          PROD=os.environ["PRODUCTION_SUPABASE_PROJECT_REF"]
          EXP=os.environ["EXPECTED_STAGING_REF"]
          for k in ["STAGING_DATABASE_URL","STAGING_SUPABASE_URL","STAGING_ANON_KEY","STAGING_SERVICE_ROLE_KEY"]:
            if not os.environ.get(k):
              print("MISSING",k); sys.exit(1)
          host=urlparse(os.environ["STAGING_SUPABASE_URL"]).hostname or ""
          ref=host.split(".")[0] if host.endswith(".supabase.co") else ""
          print("STAGING_PROJECT_REF", ref)
          print("PRODUCTION_PROJECT_REF", PROD)
          print("CERT_STOP_AFTER", os.environ.get("CERT_STOP_AFTER") or "full")
          if ref!=EXP:
            print("REF_UNEXPECTED"); sys.exit(2)
          if ref==PROD or PROD in os.environ["STAGING_DATABASE_URL"]:
            print("PRODUCTION_REF_DETECTED"); sys.exit(3)
          print("IDENTITY_PREFLIGHT=PASS")
          PY

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install pg driver (isolated absolute path)
        run: |
          set -euo pipefail
          rm -rf /tmp/staging-cert-node
          mkdir -p /tmp/staging-cert-node
          cd /tmp/staging-cert-node
          npm init -y >/dev/null
          npm install pg@8.16.3
          test -f /tmp/staging-cert-node/node_modules/pg/package.json
          test -f /tmp/staging-cert-node/node_modules/pg/lib/index.js
          node -e "const {createRequire}=require('module'); const r=createRequire('/tmp/staging-cert-node/package.json'); const pg=r('pg'); if(!pg.Client) process.exit(2); console.log('PG_RESOLVE_OK', pg.Client.name)"
          echo "PG_MODULE_PATH=/tmp/staging-cert-node/node_modules/pg" >> "$GITHUB_ENV"

      - name: Run staging certification
        working-directory: artifacts/majalis
        run: node scripts/arabic-search-v4-staging-certification.mjs

      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arabic-search-v4-staging-cert
          path: |
            docs/audit/ARABIC_SEARCH_V4_STAGING_CERTIFICATION_REPORT.md
            docs/audit/ARABIC_SEARCH_V4_STAGING_CERTIFICATION_REPORT.json
          if-no-files-found: warn
