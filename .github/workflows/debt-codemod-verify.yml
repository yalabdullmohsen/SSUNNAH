name: debt-codemod-verify
# يقارن بناء main ببناء فرع debt-codemod (لقطات + computed-style، فاتح/داكن) على الصفحات الحرجة.
# لا يغيّر أي فحص مطلوب؛ تقرير فقط (artifact) ويفشل إن تجاوز فرق اللقطة الحدّ.
on:
  pull_request:
    paths:
      - "artifacts/majalis/src/**/*.css"
      - "artifacts/majalis/scripts/debt-codemod*.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feat/debt-codemod')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
      - uses: ./.github/actions/setup-workspace
      - name: Build before (base)
        run: |
          pnpm --filter @workspace/majalis run build
          cp -r artifacts/majalis/dist "$RUNNER_TEMP/dist-before"
      - name: Checkout head
        run: git fetch origin "${{ github.sha }}" && git checkout -f "${{ github.sha }}"
      - name: Build after (head)
        run: |
          pnpm --filter @workspace/majalis run build
          cp -r artifacts/majalis/dist "$RUNNER_TEMP/dist-after"
      - name: Install Chromium
        run: pnpm --filter @workspace/majalis exec playwright install --with-deps chromium
      - name: Verify
        working-directory: artifacts/majalis
        run: node scripts/debt-codemod-verify.mjs "$RUNNER_TEMP/dist-before" "$RUNNER_TEMP/dist-after" --out "$RUNNER_TEMP/debt-codemod-verify.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: debt-codemod-verify
          path: ${{ runner.temp }}/debt-codemod-verify.json
