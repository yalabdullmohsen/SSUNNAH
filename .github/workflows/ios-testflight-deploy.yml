name: iOS TestFlight Deploy

on:
  # لا بناء عند push (بقرار المالك 2026-10-09): البناء يدوي أو مجدول يومي فقط.
  # المجدول 00:00 UTC (03:00 الكويت) يُبنى فقط إن تغيّر ios/ أو fastlane/ منذ آخر بناء ناجح،
  # وبحدّ بناء واحد يوميًا؛ التشغيل اليدوي يتجاوز الحدّ.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight changelog"
        required: false
        type: string
        default: ""
      tasmee_diagnostics:
        description: "بناء قياس التسميع الداخلي (شاشة مخفية؛ لا يُرسل لمراجعة App Store). افتراضيًا: لا"
        required: false
        type: boolean
        default: false

# مجموعة واحدة لكل المستودع: لا بناءان متوازيان، والتشغيل الجديد ينتظر ولا يلغي الجاري
concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_IDENTIFIER: com.yousef.majlisilm
  APPLE_TEAM_ID: 5D8TX37HTS

jobs:
  gate:
    name: schedule-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "تشغيل يدوي — يتجاوز الحدّ اليومي"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-testflight-deploy.yml/runs?status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.id != '"$GITHUB_RUN_ID"')] | first // empty | "\(.head_sha) \(.created_at)"')"
          if [ -z "$LAST" ]; then
            echo "لا بناء ناجح سابق — يُبنى"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          read -r SHA AT <<<"$LAST"
          if [ $(( $(date -u +%s) - $(date -u -d "$AT" +%s) )) -lt 72000 ]; then
            echo "بناء ناجح قبل أقل من 20 ساعة ($AT) — حدّ بناء واحد يوميًا"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "آخر SHA ناجح ($SHA) غير موجود في التاريخ — يُبنى"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$SHA" HEAD -- artifacts/majalis/ios fastlane; then
            echo "لا تغيير في ios/ أو fastlane/ منذ $SHA — لا بناء"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "تغيّر ios/ منذ $SHA — يُبنى"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: fastlane-beta
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          # App Store Connect يرفض الرفع بـSDK قديم — أحدث Xcode مستقر على المشغّل
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
          # بناء TestFlight/App Store على Xcode مستقر فقط (لا beta/RC)
          if xcodebuild -version | grep -qiE "beta|release candidate|\bRC\b"; then
            echo "::error::Xcode التجريبي غير مسموح لبناء TestFlight"; exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install JS deps + web build + Capacitor sync
        env:
          PORT: "24216"
          BASE_PATH: "/"
          # شاشة قياس التسميع تُجمَّع فقط عند الطلب الصريح في تشغيل يدوي (لا في وسوم v*)
          VITE_TASMEE_DIAGNOSTICS: ${{ github.event.inputs.tasmee_diagnostics == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/majalis run build
          cd artifacts/majalis
          pnpm exec cap sync ios

      - name: Cache SPM
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            artifacts/majalis/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('artifacts/majalis/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Fastlane gems
        run: bundle install --jobs 4 --retry 3

      - name: Resolve SPM packages
        working-directory: artifacts/majalis/ios/App
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Decode App Store Connect API key material
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for s in APP_STORE_CONNECT_API_KEY_KEY APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!s:-}" ]; then echo "::error::Missing secret $s"; exit 1; fi
          done
          # مفتاح مؤقت خارج المستودع لمصادقة xcodebuild (التوقيع السحابي) وfastlane
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          # يقبل PEM خامًا أو Base64 ويتحقق بـopenssl قبل fastlane (سبب «invalid curve name»)
          bash scripts/ci/write-asc-api-key.sh "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import fixed signing certificate
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # شهادة ثابتة (Apple Distribution + Apple Development) من الأسرار: التوقيع التلقائي يعيد استخدامها
          # بدل إنشاء شهادة جديدة على كل مشغّل نظيف (سبب بلوغ حدّ الشهادات).
          if [ -z "${IOS_SIGNING_P12_BASE64:-}" ]; then
            echo "::warning::IOS_SIGNING_P12_BASE64 غير مضبوط — سيُنشئ التوقيع التلقائي شهادة جديدة لهذا التشغيل"; exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "${IOS_SIGNING_P12_PASSWORD:-}" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          security find-identity -v -p codesigning "$KC"

      - name: Run Fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.changelog || github.event.head_commit.message || github.ref_name }}
          TASMEE_DIAGNOSTICS: ${{ github.event.inputs.tasmee_diagnostics == 'true' && '1' || '' }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: majlisilm-testflight-ipa
          path: |
            artifacts/majalis/ios/build/*.ipa
            artifacts/majalis/ios/build/*.xcresult
          if-no-files-found: warn

      - name: Remove temporary API key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
