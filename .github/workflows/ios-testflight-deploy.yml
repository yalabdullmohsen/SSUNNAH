name: iOS TestFlight Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "ios/**"
      - "artifacts/**"
      - "!artifacts/**/reports/**"
      - "!artifacts/**/docs/**"
      - "!artifacts/**/*.md"
      - "fastlane/**"
      - ".github/workflows/ios-testflight-deploy.yml"
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight changelog"
        required: false
        type: string
        default: ""

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_IDENTIFIER: com.yousef.majlisilm
  APPLE_TEAM_ID: 5D8TX37HTS

jobs:
  testflight:
    name: fastlane-beta
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          # App Store Connect يرفض الرفع بـSDK قديم — أحدث Xcode مستقر على المشغّل
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install JS deps + web build + Capacitor sync
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/majalis run build
          cd artifacts/majalis
          pnpm exec cap sync ios

      - name: Cache SPM
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            artifacts/majalis/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('artifacts/majalis/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Fastlane gems
        run: bundle install --jobs 4 --retry 3

      - name: Resolve SPM packages
        working-directory: artifacts/majalis/ios/App
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Decode App Store Connect API key material
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for s in APP_STORE_CONNECT_API_KEY_KEY APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!s:-}" ]; then echo "::error::Missing secret $s"; exit 1; fi
          done
          # مفتاح مؤقت خارج المستودع لمصادقة xcodebuild (التوقيع السحابي) وfastlane
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          (umask 077; echo "$APP_STORE_CONNECT_API_KEY_KEY" | base64 --decode > "$KEY_PATH")
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Run Fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.changelog || github.event.head_commit.message || github.ref_name }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: majlisilm-testflight-ipa
          path: |
            artifacts/majalis/ios/build/*.ipa
            artifacts/majalis/ios/build/*.xcresult
          if-no-files-found: warn

      - name: Remove temporary API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
