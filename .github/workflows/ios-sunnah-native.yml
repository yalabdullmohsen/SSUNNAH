name: iOS SunnahNative tests

# اختبارات حزمة الهيكل الأصلي (docs/program/PLAN.md) — تعمل فقط عند تغيّرها.
on:
  # بقرار المالك 2026-10-11: لا runner مدفوع تلقائيًا؛ البوابة الوحيدة لـnative-app هي scripts/native-loop.sh المحلي.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sunnah-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test on iOS Simulator
        working-directory: artifacts/majalis/ios/App/SunnahNative
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -scheme SunnahNative -destination "id=$SIM" test -quiet
